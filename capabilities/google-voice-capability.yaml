naftiko: 1.0.0-alpha2
info:
  label: Google Voice API
  description: Google Voice is a telecommunications service by Google that provides call forwarding, voicemail, text messaging,
    and voice calling. While Google Voice does not offer an official public REST API, the platform integrates with Google
    Workspace for business telephony. This specification documents the known endpoints and capabilities based on the Google
    Workspace Admin SDK and related voice management interfaces for provisioning and managing Google Voice services programmatically.
  tags:
  - Google
  - Voice
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
capability:
  consumes:
  - type: http
    namespace: google-voice
    baseUri: https://admin.googleapis.com
    description: Google Voice API HTTP API.
    resources:
    - name: admin-directory-v1-customer-customerid-resources
      path: /admin/directory/v1/customer/{customerId}/resources/buildings
      operations:
      - name: listbuildings
        method: GET
        description: Google Voice List Buildings
        inputParameters:
        - name: customerId
          in: path
          type: string
          required: true
          description: The Google Workspace customer ID.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: admin-directory-v1-users
      path: /admin/directory/v1/users
      operations:
      - name: listusers
        method: GET
        description: Google Voice List Users
        inputParameters:
        - name: domain
          in: query
          type: string
          description: The domain name.
        - name: maxResults
          in: query
          type: integer
          description: Maximum number of results.
        - name: pageToken
          in: query
          type: string
          description: Token for pagination.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: admin-directory-v1-users-userkey
      path: /admin/directory/v1/users/{userKey}
      operations:
      - name: getuser
        method: GET
        description: Google Voice Get User
        inputParameters:
        - name: userKey
          in: path
          type: string
          required: true
          description: The user's email address or unique ID.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: google-voice-rest
    description: REST adapter for Google Voice API.
    resources:
    - path: /admin/directory/v1/customer/{customerId}/resources/buildings
      name: listbuildings
      operations:
      - method: GET
        name: listbuildings
        description: Google Voice List Buildings
        call: google-voice.listbuildings
        with:
          customerId: rest.customerId
        outputParameters:
        - type: object
          mapping: $.
    - path: /admin/directory/v1/users
      name: listusers
      operations:
      - method: GET
        name: listusers
        description: Google Voice List Users
        call: google-voice.listusers
        outputParameters:
        - type: object
          mapping: $.
    - path: /admin/directory/v1/users/{userKey}
      name: getuser
      operations:
      - method: GET
        name: getuser
        description: Google Voice Get User
        call: google-voice.getuser
        with:
          userKey: rest.userKey
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: google-voice-mcp
    transport: http
    description: MCP adapter for Google Voice API for AI agent use.
    tools:
    - name: listbuildings
      description: Google Voice List Buildings
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: google-voice.listbuildings
      with:
        customerId: tools.customerId
      inputParameters:
      - name: customerId
        type: string
        description: The Google Workspace customer ID.
        required: true
      outputParameters:
      - type: object
        mapping: $.
    - name: listusers
      description: Google Voice List Users
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: google-voice.listusers
      with:
        domain: tools.domain
        maxResults: tools.maxResults
        pageToken: tools.pageToken
      inputParameters:
      - name: domain
        type: string
        description: The domain name.
      - name: maxResults
        type: integer
        description: Maximum number of results.
      - name: pageToken
        type: string
        description: Token for pagination.
      outputParameters:
      - type: object
        mapping: $.
    - name: getuser
      description: Google Voice Get User
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: google-voice.getuser
      with:
        userKey: tools.userKey
      inputParameters:
      - name: userKey
        type: string
        description: The user's email address or unique ID.
        required: true
      outputParameters:
      - type: object
        mapping: $.
